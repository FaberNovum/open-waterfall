[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-waterfall"
version = "0.1.0"
description = "Open-source toolkit for enrichment waterfalls, scoring, AI research, outbound messaging, and sinks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Open Waterfall Maintainers"}
]
dependencies = [
  "aiolimiter>=1.1.0",
  "click>=8.1.0",
  "httpx>=0.25.0",
  "openai>=1.0.0",
  "pandas>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.1.0",
]
hubspot = [
  "hubspot-api-client>=12.0.0",
]

[project.scripts]
open-waterfall = "open_waterfall.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
