profiles:
  - generic_b2b
  - outbound_csv

providers:
  company_waterfall:
    - apollo

source:
  enabled: true
  provider: apollo
  max_results: 25
  page_size: 25
  min_score: 50
  filters:
    titles:
      - VP Sales
      - Head of Sales
    seniorities:
      - vp
      - director
    locations:
      - United States
    employee_ranges:
      - 51,200
      - 201,500
    email_status:
      - verified

sinks:
  enabled:
    - csv
  csv:
    output_path: ./output/sourced.csv
